set default=0
set timeout=5

menuentry "Losedoze 1.0" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 quiet
    initrd /boot/initramfs.cpio.gz
}

menuentry "Losedoze 1.0 (verbose)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 ignore_loglevel
    initrd /boot/initramfs.cpio.gz
}
